[package]
name = "opemos-interstitial"
version = "0.1.0"
description = "No-input DRM/KMS boot interstitial for OPEMOS"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14.1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
