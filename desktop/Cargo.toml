[package]
name = "opemos-recovery-status"
version = "0.1.0"
description = "Lightweight SteamOS Desktop Mode status companion for OPEMOS"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

